<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect width="920" height="560" rx="10" fill="#fbfaf9"/>

  <text x="34" y="42" font-size="19" font-weight="700" fill="#1c1917">Two secrets, two lifecycles, one writer each</text>
  <text x="34" y="64" font-size="13" fill="#78716c">Managing both the same way is what would break the rotation</text>

  <!-- ===================== ROTATING ===================== -->
  <rect x="34" y="90" width="410" height="352" rx="10" fill="#fffdf7" stroke="#d97706" stroke-width="2"/>
  <rect x="34" y="90" width="410" height="34" rx="10" fill="#fde68a"/>
  <rect x="34" y="112" width="410" height="12" fill="#fde68a"/>
  <text x="54" y="113" font-size="13.5" font-weight="700" fill="#78350f">ROTATING — every 60 seconds</text>

  <rect x="112" y="146" width="254" height="58" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="239" y="171" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">credential-rotator</text>
  <text x="239" y="190" font-size="11" fill="#92400e" text-anchor="middle">CronJob · the only writer</text>

  <line x1="239" y1="204" x2="239" y2="250" stroke="#b45309" stroke-width="1.8" marker-end="url(#am)"/>
  <text x="250" y="231" font-size="11" fill="#92400e">patch</text>

  <rect x="112" y="256" width="254" height="58" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="239" y="281" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">Secret</text>
  <text x="239" y="299" font-size="11" fill="#92400e" text-anchor="middle">mongodb-app-credentials</text>

  <line x1="239" y1="314" x2="239" y2="360" stroke="#b45309" stroke-width="1.8" marker-end="url(#am)"/>
  <text x="250" y="334" font-size="11" font-weight="600" fill="#92400e">mounted volume</text>
  <text x="250" y="349" font-size="10.5" fill="#92400e">polled every 5s</text>

  <rect x="112" y="366" width="254" height="54" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="239" y="389" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">api pod</text>
  <text x="239" y="407" font-size="10.5" fill="#92400e" text-anchor="middle">rebuilds its client, no restart</text>

  <!-- ===================== STATIC ===================== -->
  <rect x="478" y="90" width="410" height="352" rx="10" fill="#fbfdff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="478" y="90" width="410" height="34" rx="10" fill="#bfdbfe"/>
  <rect x="478" y="112" width="410" height="12" fill="#bfdbfe"/>
  <text x="498" y="113" font-size="13.5" font-weight="700" fill="#1e3a8a">STATIC — changes almost never</text>

  <rect x="540" y="140" width="286" height="50" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="683" y="161" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">GCP Secret Manager</text>
  <text x="683" y="178" font-size="10.5" fill="#1e40af" text-anchor="middle">versioned · IAM-scoped · audited · the only writer</text>

  <line x1="683" y1="190" x2="683" y2="222" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#bl)"/>

  <rect x="540" y="228" width="286" height="50" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="683" y="249" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">External Secrets Operator</text>
  <text x="683" y="266" font-size="10.5" fill="#1e40af" text-anchor="middle">Workload Identity — no key file anywhere</text>

  <line x1="683" y1="278" x2="683" y2="310" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#bl)"/>
  <text x="694" y="299" font-size="10.5" fill="#1e40af">refresh 1h</text>

  <rect x="540" y="316" width="286" height="50" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="683" y="337" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Secret</text>
  <text x="683" y="354" font-size="10.5" fill="#1e40af" text-anchor="middle">upstream-api</text>

  <line x1="683" y1="366" x2="683" y2="392" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#bl)"/>
  <text x="694" y="384" font-size="10.5" fill="#1e40af">secretKeyRef → env var</text>

  <rect x="540" y="398" width="286" height="30" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="683" y="418" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">api pod</text>

  <!-- ===================== WARNING ===================== -->
  <rect x="34" y="462" width="854" height="76" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="56" y="488" font-size="13" font-weight="700" fill="#991b1b">A secret can have exactly one writer</text>
  <text x="56" y="509" font-size="11.5" fill="#57534e">If External Secrets also managed the left-hand Secret, it would reconcile against Secret Manager, revert the rotator's change</text>
  <text x="56" y="527" font-size="11.5" fill="#57534e">mid-cycle, and hand pods a credential that had already been rotated away — an intermittent failure that is painful to diagnose.</text>
</svg>
