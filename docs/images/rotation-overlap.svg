<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a8a29e" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="920" height="500" rx="10" fill="#fbfaf9"/>

  <text x="34" y="42" font-size="19" font-weight="700" fill="#1c1917">Why two users, and why the overlap is required</text>
  <text x="34" y="64" font-size="13" fill="#78716c">Each run rotates the INACTIVE user, so every credential stays valid for two full cycles</text>

  <!-- ===== which user the Secret points to ===== -->
  <text x="104" y="112" font-size="11.5" font-weight="600" fill="#57534e" text-anchor="end">Secret points to</text>

  <rect x="120" y="96" width="187" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="213" y="113" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">app_b</text>

  <rect x="307" y="96" width="187" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="400" y="113" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">app_a</text>

  <rect x="494" y="96" width="187" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="587" y="113" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">app_b</text>

  <rect x="681" y="96" width="187" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="774" y="113" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">app_a</text>

  <!-- ===== app_a validity lane ===== -->
  <text x="104" y="176" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="end">app_a</text>
  <text x="104" y="192" font-size="10.5" fill="#78716c" text-anchor="end">password valid</text>

  <rect x="120" y="152" width="187" height="42" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="213" y="178" font-size="11" fill="#1e40af" text-anchor="middle">valid (set earlier)</text>

  <rect x="307" y="152" width="374" height="42" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="494" y="172" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">password set at t=60</text>
  <text x="494" y="187" font-size="10.5" fill="#1e40af" text-anchor="middle">valid for 120s — two cycles</text>

  <rect x="681" y="152" width="187" height="42" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="774" y="178" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">set at t=180</text>

  <!-- ===== app_b validity lane ===== -->
  <text x="104" y="258" font-size="13" font-weight="700" fill="#78350f" text-anchor="end">app_b</text>
  <text x="104" y="274" font-size="10.5" fill="#78716c" text-anchor="end">password valid</text>

  <rect x="120" y="234" width="374" height="42" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="307" y="254" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">password set at t=0</text>
  <text x="307" y="269" font-size="10.5" fill="#92400e" text-anchor="middle">valid for 120s — two cycles</text>

  <rect x="494" y="234" width="374" height="42" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="681" y="254" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">password set at t=120</text>
  <text x="681" y="269" font-size="10.5" fill="#92400e" text-anchor="middle">previous app_b password dies here</text>

  <!-- ===== propagation window ===== -->
  <rect x="120" y="296" width="187" height="30" rx="4" fill="url(#hatch)" opacity="0.45"/>
  <rect x="120" y="296" width="187" height="30" rx="4" fill="none" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="213" y="316" font-size="10.5" font-weight="600" fill="#44403c" text-anchor="middle">kubelet propagation — up to 60s</text>
  <text x="320" y="316" font-size="10.5" fill="#57534e">a pod in here may still be using app_a — and app_a still works</text>

  <!-- ===== time axis ===== -->
  <line x1="110" y1="356" x2="878" y2="356" stroke="#57534e" stroke-width="1.5" marker-end="url(#tick)"/>

  <g font-size="11" fill="#57534e" text-anchor="middle">
    <line x1="120" y1="350" x2="120" y2="362" stroke="#57534e" stroke-width="1.5"/>
    <text x="120" y="378">t = 0s</text>
    <line x1="307" y1="350" x2="307" y2="362" stroke="#57534e" stroke-width="1.5"/>
    <text x="307" y="378">60s</text>
    <line x1="494" y1="350" x2="494" y2="362" stroke="#57534e" stroke-width="1.5"/>
    <text x="494" y="378">120s</text>
    <line x1="681" y1="350" x2="681" y2="362" stroke="#57534e" stroke-width="1.5"/>
    <text x="681" y="378">180s</text>
    <line x1="868" y1="350" x2="868" y2="362" stroke="#57534e" stroke-width="1.5"/>
    <text x="868" y="378">240s</text>
  </g>

  <g stroke="#a8a29e" stroke-width="1" stroke-dasharray="3 4">
    <line x1="307" y1="96" x2="307" y2="348"/>
    <line x1="494" y1="96" x2="494" y2="348"/>
    <line x1="681" y1="96" x2="681" y2="348"/>
  </g>

  <!-- ===== takeaway ===== -->
  <rect x="120" y="404" width="748" height="72" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="140" y="428" font-size="12.5" font-weight="700" fill="#1c1917">The point</text>
  <text x="140" y="449" font-size="11.5" fill="#57534e">At every instant two credentials are valid: the one just published, and the previous one. Rotation and propagation both take</text>
  <text x="140" y="466" font-size="11.5" fill="#57534e">up to 60 seconds, so they race — the overlap is what guarantees a slow pod never holds a password that has already expired.</text>
</svg>
