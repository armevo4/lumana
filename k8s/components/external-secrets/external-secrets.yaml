# Projects secrets from GCP Secret Manager into Kubernetes Secrets.
#
# This is how the brief's "create a Kubernetes secret for the exposed API" requirement is
# satisfied *properly*: Secret Manager is the source of truth — versioned, IAM-scoped,
# audit-logged — and External Secrets Operator materialises it as the Kubernetes Secret
# the pods consume. See docs/SECRETS.md.
#
# Note what is NOT here: the rotating database credential. The rotator owns that Secret
# and patches it every minute; a second reconciler would revert it mid-cycle and the
# rotation would appear to fail intermittently. A secret can have exactly one writer.

# A namespaced SecretStore rather than a cluster-scoped ClusterSecretStore, for two
# reasons: staging and production each get their own, so neither can read the other's
# secrets; and Kustomize's namespace transformer handles namespaced resources correctly
# without needing to know that a CRD is cluster-scoped.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      # No auth block: the operator uses the ambient credentials of its own pod, which
      # come from Workload Identity via the annotated external-secrets ServiceAccount.
      # No service account key file exists anywhere in this chain.
      # Not a secret; this is just the GCP project holding the secrets.
      projectID: lumana-123
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: upstream-api
spec:
  # The upstream API key is effectively static, so an hourly refresh is ample. Contrast
  # with the database credential's 60-second cycle — different lifecycles, different
  # machinery.
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: upstream-api
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: tmdb-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: mongodb-admin
    creationPolicy: Owner
    template:
      data:
        # The username is not a secret, so it is templated in rather than stored.
        username: "root"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: mongodb-admin-password
