# Placeholder Secrets. Real values never live in this repository.
#
# Two important notes:
#
# 1. `mongodb-app-credentials` is a PLAIN Secret, not a Kustomize secretGenerator.
#    secretGenerator appends a content hash to the resource name, which would fight with
#    a CronJob that patches the Secret in place — every rotation would orphan the old
#    hashed Secret and the Deployment would keep mounting a stale name.
#
# 2. Applying this manifest resets the credentials to the placeholder below. That is
#    survivable by design: the application keeps serving on its existing connection, and
#    the next CronJob run (within 60 seconds) rotates and republishes a working
#    credential. In a GitOps setup you would exclude this resource from sync instead.
#
# The upstream API key is supplied at deploy time, not committed. See the overlay
# kustomization files for how it is injected.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-app-credentials
  labels:
    app.kubernetes.io/name: api
    lumana.io/rotated-by: credential-rotator
type: Opaque
stringData:
  username: "app_a"
  password: "placeholder-replaced-on-first-rotation"
# The MongoDB admin credential and the upstream API key are NOT defined here. They carry
# real secret values, so they are produced per overlay:
#   * dev        - secretGenerator from a gitignored file (make k8s-secrets)
#   * staging /  - an ExternalSecret, projected from GCP Secret Manager by External
#     production   Secrets Operator via Workload Identity
#
# Only the rotating credential above lives in the base, because it must be a plain
# Secret that the rotator can patch in place. See docs/SECRETS.md.
