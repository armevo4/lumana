apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production runs on its own GKE cluster: three replicas, a PodDisruptionBudget so node
# maintenance cannot take the service below two, autoscaling under load, larger storage,
# and quieter logs.
namespace: lumana-production

resources:
  - ../../base
  - pdb.yaml
  - hpa.yaml

components:
  - ../../components/external-secrets

configMapGenerator:
  - name: api-config
    behavior: replace
    literals:
      - APP_ENVIRONMENT=production
      - APP_LOG_LEVEL=WARNING
      - APP_PORT=9000
      - APP_MONGO_HOST=mongodb
      - APP_MONGO_PORT=27017
      - APP_MONGO_DATABASE=lumana
      - APP_MONGO_AUTH_SOURCE=lumana
      - APP_MONGO_CREDENTIALS_DIR=/etc/mongo-credentials
      - APP_CREDENTIALS_POLL_SECONDS=5
      - APP_CACHE_TTL_SECONDS=600

replicas:
  - name: api
    count: 3

images:
  - name: lumana/api
    newTag: production
  - name: lumana/rotator
    newTag: production

patches:
  - path: ingress-host.yaml
  - path: api-resources.yaml
  - path: api-port.yaml
    target:
      kind: Deployment
      name: api
  - path: mongodb-storage.yaml
    target:
      kind: StatefulSet
      name: mongodb
