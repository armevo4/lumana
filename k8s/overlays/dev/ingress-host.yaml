# localtest.me resolves to 127.0.0.1 from anywhere, so a kind cluster with the ingress
# port mapped to the host is reachable at this name with no /etc/hosts editing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  rules:
    - host: lumana.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
