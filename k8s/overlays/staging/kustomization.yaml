apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging runs on its own GKE cluster. Two replicas so a rolling update and a credential
# rotation can both be observed against real load, and persistent storage so the
# database survives a pod reschedule.
namespace: lumana-staging

resources:
  - ../../base

# Pull the API key and MongoDB admin password from GCP Secret Manager. Dev omits this
# component and uses local files instead, since kind has no GCP.
components:
  - ../../components/external-secrets

configMapGenerator:
  - name: api-config
    behavior: replace
    literals:
      - APP_ENVIRONMENT=staging
      - APP_LOG_LEVEL=INFO
      - APP_PORT=8080
      - APP_MONGO_HOST=mongodb
      - APP_MONGO_PORT=27017
      - APP_MONGO_DATABASE=lumana
      - APP_MONGO_AUTH_SOURCE=lumana
      - APP_MONGO_CREDENTIALS_DIR=/etc/mongo-credentials
      - APP_CREDENTIALS_POLL_SECONDS=5
      - APP_CACHE_TTL_SECONDS=300

replicas:
  - name: api
    count: 2

images:
  - name: lumana/api
    newTag: staging
  - name: lumana/rotator
    newTag: staging

patches:
  - path: ingress-host.yaml
  - path: api-port.yaml
    target:
      kind: Deployment
      name: api
  # A JSON 6902 patch cannot infer its target from the file, so it is named explicitly.
  - path: mongodb-storage.yaml
    target:
      kind: StatefulSet
      name: mongodb
